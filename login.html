<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - EDORA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: url('login_background.png') no-repeat center center fixed;
            background-size: cover;
            position: relative;
            font-family: 'Outfit', sans-serif;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, rgba(26, 35, 126, 0.2) 0%, rgba(10, 14, 52, 0.6) 100%);
            backdrop-filter: blur(8px);
            z-index: -1;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 3.5rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            margin-bottom: 2.5rem;
        }

        .login-logo-text {
            font-size: 5rem;
            /* Much larger */
            font-weight: 800;
            letter-spacing: -0.05em;
            line-height: 1;
            background: linear-gradient(135deg, #1a237e 0%, var(--accent-secondary) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .input-group {
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.6rem;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-group input {
            width: 100%;
            padding: 1rem 1.2rem;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-group input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.15);
            background: rgba(255, 255, 255, 0.1);
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 1.2rem;
            user-select: none;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--accent-primary);
        }

        .login-btn {
            background: linear-gradient(135deg, #1a237e 0%, #3949ab 100%);
            color: white;
            padding: 1.2rem;
            border-radius: 1rem;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 1.5rem;
            box-shadow: 0 10px 20px -5px rgba(26, 35, 126, 0.4);
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px -5px rgba(26, 35, 126, 0.6);
            filter: brightness(1.2);
        }

        .error-message {
            color: var(--accent-error);
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="login-header">
            <div class="login-logo-text">EDORA</div>
            <div class="login-subtitle">Eminent Documentary Reporting Assistant</div>
        </div>

        <form class="login-form" id="loginForm">
            <div class="input-group">
                <label for="email" id="emailLabel">Correo o Nombre</label>
                <input type="text" id="email" placeholder="nombre@empresa.com o Usuario" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <span class="toggle-password" id="togglePassword">👁️</span>
                </div>
                <div class="error-message" id="passwordError">La contraseña debe tener al menos 5 caracteres.</div>
            </div>

            <button type="submit" class="login-btn" id="submitBtn">Ingresar</button>
            <div id="authToggleContainer" style="margin-top: 1rem; font-size: 0.85rem; color: var(--text-muted);">
                <span id="toggleText">¿No tienes cuenta?</span>
                <a href="#" id="toggleAuth"
                    style="color: var(--accent-secondary); font-weight: 600; text-decoration: none;">Regístrate aquí</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="login.js"></script>
</body>

</html>
